<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jurnal Kelas - Catatan Perilaku Siswa SDIT Ihyaussunnah</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4F46E5;
            --primary-hover: #4338CA;
            --success-color: #10B981;
            --success-hover: #059669;
            --danger-color: #EF4444;
            --danger-hover: #DC2626;
            --bg-color: #F3F4F6;
            --card-bg: #FFFFFF;
            --text-main: #1F2937;
            --text-muted: #6B7280;
            --border-color: #E5E7EB;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: var(--primary-color);
            margin-bottom: 5px;
            font-size: 1.8rem;
        }

        .header p {
            color: var(--text-muted);
            margin-top: 0;
            font-size: 0.95rem;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            padding: 25px;
            margin-bottom: 25px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        label {
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 0.9em;
            color: var(--text-main);
        }

        input, textarea, select {
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-family: inherit;
            font-size: 1em;
            transition: border-color 0.3s;
            width: 100%;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        button {
            cursor: pointer;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1em;
            color: white;
            transition: background-color 0.3s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-primary { background-color: var(--primary-color); width: 100%; }
        .btn-primary:hover { background-color: var(--primary-hover); }
        
        .btn-success { background-color: var(--success-color); gap: 8px; }
        .btn-success:hover { background-color: var(--success-hover); }
        
        .btn-danger { background-color: var(--danger-color); padding: 8px 12px; font-size: 0.85em; }
        .btn-danger:hover { background-color: var(--danger-hover); }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        /* Badge Kategori */
        .badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.85em;
            font-weight: 600;
            display: inline-block;
            text-align: center;
        }
        .badge-ringan { background-color: #D1FAE5; color: #065F46; }
        .badge-sedang { background-color: #FEF3C7; color: #92400E; }
        .badge-berat  { background-color: #FEE2E2; color: #991B1B; }

        .poin-text {
            font-weight: 700;
            color: var(--primary-color);
            font-size: 1.1em;
        }

        /* Responsive Table Wrapper */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 950px; 
        }

        th, td {
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.95em;
        }

        th {
            background-color: #F9FAFB;
            font-weight: 600;
            white-space: nowrap;
        }

        .empty-state {
            text-align: center;
            padding: 30px;
            color: var(--text-muted);
            font-style: italic;
        }

        /* MEDIA QUERIES UNTUK MOBILE */
        @media (max-width: 768px) {
            body { padding: 15px 10px; }
            .card { padding: 20px 15px; }
            .form-grid { grid-template-columns: 1fr; }
            .form-group.full-width { grid-column: span 1; }
            .toolbar { flex-direction: column; align-items: flex-start; gap: 15px; }
            .toolbar button { width: 100%; }
        }

        /* PENGATURAN KHUSUS UNTUK PRINT / EXPORT PDF */
        @media print {
            body { background-color: white; padding: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .hide-on-print, #jurnalForm, .toolbar button, .action-col { display: none !important; }
            .card { box-shadow: none; padding: 0; margin: 0; }
            .table-responsive { overflow: visible; border: none; }
            #printHeader { display: block !important; text-align: center; margin-bottom: 20px; }
            table { min-width: 100%; border: 1px solid black; }
            th, td { border: 1px solid black; padding: 8px; font-size: 11pt; }
            th { background-color: #f2f2f2 !important; }
            .badge-ringan { background-color: #D1FAE5 !important; color: #065F46 !important; }
            .badge-sedang { background-color: #FEF3C7 !important; color: #92400E !important; }
            .badge-berat  { background-color: #FEE2E2 !important; color: #991B1B !important; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header hide-on-print">
        <h1>Jurnal Kelas</h1>
        <p>Sistem Pencatatan Perilaku Siswa Terpadu SDIT Ihyaussunnah</p>
    </div>

    <!-- Form Input Data -->
    <div class="card hide-on-print">
        <form id="jurnalForm">
            <div class="form-grid">
                <!-- Baris 1 -->
                <div class="form-group">
                    <label>Tanggal</label>
                    <input type="date" id="tanggal" required>
                </div>
                <div class="form-group">
                    <label>Kelas</label>
                    <input type="text" id="kelas" placeholder="Contoh: 3 Abu Bakar Ash Shiddiq" required>
                </div>

                <!-- Baris 2 -->
                <div class="form-group">
                    <label>Mata Pelajaran</label>
                    <input type="text" id="mataPelajaran" placeholder="Contoh: Matematika, Bahasa Indonesia" required>
                </div>
                <div class="form-group">
                    <label>Nama Murid</label>
                    <input type="text" id="nama" placeholder="Masukkan nama murid" required>
                </div>

                <!-- Baris 3 -->
                <div class="form-group">
                    <label>Kategori Pelanggaran</label>
                    <select id="kategori" required>
                        <option value="" disabled selected>Pilih Kategori...</option>
                        <option value="Ringan">Ringan</option>
                        <option value="Sedang">Sedang</option>
                        <option value="Berat">Berat</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Poin (1 - 50)</label>
                    <input type="number" id="poin" min="1" max="50" placeholder="Contoh: 10" required>
                </div>

                <!-- Baris 4 & 5 -->
                <div class="form-group full-width">
                    <label>Deskripsi Perilaku / Kronologi Kejadian</label>
                    <textarea id="deskripsi" rows="3" placeholder="Deskripsikan kejadian..." required></textarea>
                </div>
                <div class="form-group full-width">
                    <label>Tindakan / Penanganan Guru</label>
                    <textarea id="tindakan" rows="2" placeholder="Tindakan yang telah diberikan..." required></textarea>
                </div>
            </div>
            <div style="margin-top: 20px; text-align: right;">
                <button type="submit" class="btn-primary">Simpan Catatan</button>
            </div>
        </form>
    </div>

    <!-- Tabel Data -->
    <div class="card">
        <div class="toolbar hide-on-print">
            <h2 style="margin:0; font-size: 1.2rem;">Rekapitulasi Jurnal & Poin</h2>
            <button class="btn-success" onclick="window.print()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2M6 14h12v8H6z"/></svg>
                Simpan sebagai PDF / Cetak
            </button>
        </div>
        
        <!-- Header Print (Hanya muncul di PDF) -->
        <div id="printHeader" style="display: none;">
            <h2>JURNAL KELAS & REKAP POIN SISWA</h2>
            <hr style="border-top: 2px solid black; margin-bottom: 20px;">
        </div>

        <!-- Wrapper Responsif untuk Tabel -->
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th width="5%">No</th>
                        <th width="10%">Tanggal</th>
                        <th width="8%">Kelas</th>
                        <th width="12%">Mata Pelajaran</th>
                        <th width="15%">Nama Murid</th>
                        <th width="8%">Kategori</th>
                        <th width="5%">Poin</th>
                        <th width="17%">Deskripsi Kejadian</th>
                        <th width="15%">Tindakan</th>
                        <th width="5%" class="action-col">Aksi</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const STORAGE_KEY = 'JURNAL_KELAS_DATA';
    let jurnalData = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    document.getElementById('tanggal').valueAsDate = new Date();

    function renderTable() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';

        if (jurnalData.length === 0) {
            tbody.innerHTML = `<tr><td colspan="10" class="empty-state">Belum ada catatan jurnal.</td></tr>`;
            return;
        }

        const sortedData = [...jurnalData].reverse();

        sortedData.forEach((item, index) => {
            const dateObj = new Date(item.tanggal);
            const formattedDate = `${dateObj.getDate().toString().padStart(2, '0')}/${(dateObj.getMonth() + 1).toString().padStart(2, '0')}/${dateObj.getFullYear()}`;

            const kategoriStr = item.kategori || '-';
            let badgeClass = 'badge-ringan';
            if(kategoriStr === 'Sedang') badgeClass = 'badge-sedang';
            if(kategoriStr === 'Berat') badgeClass = 'badge-berat';

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${index + 1}</td>
                <td>${formattedDate}</td>
                <td>${item.kelas}</td>
                <!-- Menggunakan item.mataPelajaran, atau item.jamPelajaran untuk backwards compatibility -->
                <td>${item.mataPelajaran || item.jamPelajaran || '-'}</td>
                <td><strong>${item.nama}</strong></td>
                <td>
                    ${kategoriStr !== '-' ? `<span class="badge ${badgeClass}">${kategoriStr}</span>` : '-'}
                </td>
                <td class="poin-text">${item.poin ? item.poin : '0'}</td>
                <td>${item.deskripsi}</td>
                <td>${item.tindakan}</td>
                <td class="action-col">
                    <button class="btn-danger" onclick="deleteEntry(${item.id})">Hapus</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    document.getElementById('jurnalForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const newData = {
            id: Date.now(),
            tanggal: document.getElementById('tanggal').value,
            kelas: document.getElementById('kelas').value,
            mataPelajaran: document.getElementById('mataPelajaran').value,
            nama: document.getElementById('nama').value,
            kategori: document.getElementById('kategori').value,
            poin: document.getElementById('poin').value,
            deskripsi: document.getElementById('deskripsi').value,
            tindakan: document.getElementById('tindakan').value
        };
        
        jurnalData.push(newData);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(jurnalData));
        
        // Reset form isian tertentu (Tanggal, Kelas, dan Mata Pelajaran dibiarkan agar lebih cepat)
        document.getElementById('nama').value = '';
        document.getElementById('kategori').value = '';
        document.getElementById('poin').value = '';
        document.getElementById('deskripsi').value = '';
        document.getElementById('tindakan').value = '';
        document.getElementById('nama').focus();
        
        renderTable();
    });

    function deleteEntry(id) {
        if(confirm('Hapus catatan ini?')) {
            jurnalData = jurnalData.filter(item => item.id !== id);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(jurnalData));
            renderTable();
        }
    }

    renderTable();
</script>
</body>
</html>
